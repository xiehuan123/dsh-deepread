<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DeepRead evidence-first reading workflow</title>
  <desc id="desc">A long article, book, or PDF flows through one of five reading modes into a structured report containing claims, evidence, confidence levels, relations, a mindmap, and review questions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="1070" cy="90" r="170" fill="#312e81" opacity=".28"/>
  <circle cx="130" cy="640" r="220" fill="#075985" opacity=".2"/>

  <text x="70" y="78" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">DeepRead</text>
  <text x="300" y="78" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="22">Evidence-first reading for AI agents</text>

  <g filter="url(#shadow)">
    <rect x="70" y="126" width="280" height="450" rx="24" fill="#111827" stroke="#334155"/>
    <rect x="460" y="126" width="280" height="450" rx="24" fill="#111827" stroke="#334155"/>
    <rect x="850" y="126" width="280" height="450" rx="24" fill="#111827" stroke="#334155"/>
  </g>

  <text x="100" y="174" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">1 · SOURCE</text>
  <text x="490" y="174" fill="#a5b4fc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">2 · READING MODE</text>
  <text x="880" y="174" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">3 · GROUNDED OUTPUT</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="100" y="208" width="220" height="72" rx="14" fill="#1e293b"/>
    <text x="125" y="238" fill="#f1f5f9" font-size="18">Long article or URL</text>
    <text x="125" y="261" fill="#94a3b8" font-size="14">Web · Markdown · HTML</text>
    <rect x="100" y="300" width="220" height="72" rx="14" fill="#1e293b"/>
    <text x="125" y="330" fill="#f1f5f9" font-size="18">Book or PDF</text>
    <text x="125" y="353" fill="#94a3b8" font-size="14">Page-aware citations</text>
    <rect x="100" y="392" width="220" height="72" rx="14" fill="#1e293b"/>
    <text x="125" y="422" fill="#f1f5f9" font-size="18">Multiple documents</text>
    <text x="125" y="445" fill="#94a3b8" font-size="14">Compare claims and conflicts</text>

    <rect x="490" y="208" width="220" height="52" rx="12" fill="#0c4a6e"/>
    <text x="515" y="241" fill="#e0f2fe" font-size="18">quick</text>
    <rect x="490" y="272" width="220" height="52" rx="12" fill="#1e3a8a"/>
    <text x="515" y="305" fill="#dbeafe" font-size="18">deep</text>
    <rect x="490" y="336" width="220" height="52" rx="12" fill="#312e81"/>
    <text x="515" y="369" fill="#e0e7ff" font-size="18">knowledge map</text>
    <rect x="490" y="400" width="220" height="52" rx="12" fill="#4c1d95"/>
    <text x="515" y="433" fill="#ede9fe" font-size="18">Feynman</text>
    <rect x="490" y="464" width="220" height="52" rx="12" fill="#581c87"/>
    <text x="515" y="497" fill="#f3e8ff" font-size="18">whole book</text>

    <rect x="880" y="208" width="220" height="58" rx="12" fill="#1e293b"/>
    <circle cx="902" cy="237" r="7" fill="#38bdf8"/>
    <text x="920" y="243" fill="#f1f5f9" font-size="17">Core claims</text>
    <rect x="880" y="278" width="220" height="58" rx="12" fill="#1e293b"/>
    <circle cx="902" cy="307" r="7" fill="#22c55e"/>
    <text x="920" y="313" fill="#f1f5f9" font-size="17">Evidence + location</text>
    <rect x="880" y="348" width="220" height="58" rx="12" fill="#1e293b"/>
    <circle cx="902" cy="377" r="7" fill="#f59e0b"/>
    <text x="920" y="383" fill="#f1f5f9" font-size="17">Confidence levels</text>
    <rect x="880" y="418" width="220" height="58" rx="12" fill="#1e293b"/>
    <circle cx="902" cy="447" r="7" fill="#a78bfa"/>
    <text x="920" y="453" fill="#f1f5f9" font-size="17">Relations + mindmap</text>
    <rect x="880" y="488" width="220" height="58" rx="12" fill="#1e293b"/>
    <circle cx="902" cy="517" r="7" fill="#f472b6"/>
    <text x="920" y="523" fill="#f1f5f9" font-size="17">Recall questions</text>
  </g>

  <path d="M370 351h70" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M430 339l14 12-14 12" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M760 351h70" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M820 339l14 12-14 12" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="70" y="625" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">No invented evidence · Explicit uncertainty · Markdown, HTML and XMind-compatible export</text>
</svg>
